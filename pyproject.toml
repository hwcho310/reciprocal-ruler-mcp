[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reciprocal-ruler-mcp"
version = "0.1.0"
description = "MCP server for Reciprocal Ruler: deterministic quote-lock and settlement reconciliation for AI-to-AI transactions, paid per call over x402 (USDC on Base)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Reciprocal Ruler" }]
keywords = ["mcp", "model-context-protocol", "x402", "agents", "settlement", "reconciliation", "usdc", "base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://reciprocal-ruler-x402.vercel.app"
Documentation = "https://reciprocal-ruler-x402.vercel.app/docs"
Source = "https://reciprocal-ruler-x402.vercel.app"

[project.scripts]
reciprocal-ruler-mcp = "reciprocal_ruler_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reciprocal_ruler_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
